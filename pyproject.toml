# Ruff configuration only; tools/specs is vendored as plain files, not packaged.
[tool.ruff]
line-length = 110
target-version = "py310"
# ruff also formats code blocks in Markdown. docs/ holds prose whose code blocks are
# illustrations, and test fixtures are byte-exact inputs, so neither may be rewritten.
extend-exclude = ["docs", "tools/specs/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
